name: Deploy SQLite DB to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SQLite Database
        run: python create_db.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload SQLite DB to S3
        run: |
          aws s3 cp mystocks.db s3://${{ secrets.S3_BUCKET_NAME }}/mystocks.db
          echo "Database uploaded successfully!"

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }}/github \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.yml" \
            --exclude "*.md"

      - name: Deploy Lambda functions
        run: |
          mkdir -p build
      
          deploy_lambda () {
            function_name="$1"
            shift
            files=("$@")
      
            rm -rf build/*
            for f in "${files[@]}"; do
              cp "$f" build/
            done
      
            cd build
            zip -r "../${function_name}.zip" .
            cd ..
      
            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file "fileb://${function_name}.zip"
      
            echo "Deployed ${function_name}"
          }
      
          deploy_lambda "lambda_monthly_pnl" "lambda_monthly_pnl.py" "crud_db.py"
          deploy_lambda "lambda_s3_to_efs" "lambda_s3_to_efs.py"

      # ── Trigger S3-to-EFS copy Lambda ──────────────────────────────────────
      - name: Trigger S3-to-EFS copy Lambda
        run: |
          RESPONSE=$(aws lambda invoke \
            --function-name lambda_s3_to_efs \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json)

          echo "Lambda response:"
          cat response.json

          # Fail the pipeline if Lambda returned an error
          STATUS=$(python3 -c "import json; d=json.load(open('response.json')); print(d.get('statusCode', 500))")
          if [ "$STATUS" != "200" ]; then
            echo "❌ S3-to-EFS copy failed!"
            exit 1
          fi

          echo "✅ mystocks.db successfully copied to EFS!"
