name: Deploy SQLite DB to EFS via S3

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lambdas-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Node 20 deprecation fix:
    # Do NOT force Node24 via FORCE_JAVASCRIPT_ACTIONS_TO_NODE24.
    # Instead, pin to current major versions of actions that run on the runner-supported Node version (Node24 by default as of 2026-06-16).
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (build env matches Lambda runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_*.txt

      - name: Install build tooling (zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Generate SQLite Database
        run: python create_db.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ── OPTIONAL: Upload mystocks.db to S3 (staging) ───────────────────────
      # Enable only when you really want to overwrite the DB in S3/EFS.
      # - name: Upload SQLite DB to S3
      #   env:
      #     S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      #   run: |
      #     aws s3 cp mystocks.db "s3://${S3_BUCKET_NAME}/mystocks.db"
      #     echo "✅ Database uploaded to S3 staging area"

      - name: Sync GitHub files to S3 (optional staging)
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 sync . "s3://${S3_BUCKET_NAME}/github" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.yml" \
            --exclude "*.md" \
            --exclude ".venv/*" \
            --exclude "__pycache__/*"
          echo "✅ Files synced to S3"

      # ── Deploy Lambdas ─────────────────────────────────────────────────────
      - name: Deploy Lambda functions
        env:
          AWS_REGION:             ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME:         ${{ secrets.S3_BUCKET_NAME }}
          LAMBDA_ROLE_ARN:        ${{ secrets.LAMBDA_ROLE_ARN }}
          VPC_SUBNET_IDS:         ${{ secrets.VPC_SUBNET_IDS }}        # comma-separated
          VPC_SECURITY_GROUP_ID:  ${{ secrets.VPC_SECURITY_GROUP_ID }}
          EFS_ACCESS_POINT_ARN:   ${{ secrets.EFS_ACCESS_POINT_ARN }}

          # Python 3.13 runtime setting:
          # Your deploy script must read this env var (recommended) OR you must hardcode python3.13 in the script.
          LAMBDA_PY_RUNTIME:      python3.13
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          json_escape () {
            python3 - <<'PY'
          import json,sys
          print(json.dumps(sys.stdin.read().rstrip("\n"))[1:-1])
          PY
          }

          to_json_array_from_csv () {
            python3 - <<'PY'
          import os,json
          csv = os.environ["CSV"]
          items = [x.strip() for x in csv.split(",") if x.strip()]
          print(json.dumps(items))
          PY
          }

          build_zip () {
            local function_name="$1"
            shift
            rm -rf build/*
            rm -f "${function_name}.zip"

            # Copy source files/folders into build/
            for path in "$@"; do
              if [ -d "$path" ]; then
                cp -R "$path" build/
              else
                cp "$path" build/
              fi
            done

            # Install dependencies
            if [ -f "requirements_${function_name}.txt" ]; then
              pip install -r "requirements_${function_name}.txt" -t build/
            elif [ -f "requirements.txt" ]; then
              pip install -r requirements.txt -t build/
            fi

            (cd build && zip -r "../${function_name}.zip" .)
            echo "✅ Zip created: ${function_name}.zip"
          }

          write_env_json () {
            local function_name="$1"
            shift

            # args: KEY=VALUE ...
            python3 - <<PY >"/tmp/${function_name}_env.json"
          import json,sys
          vars={}
          for pair in sys.argv[1:]:
            k,v = pair.split("=",1)
            vars[k]=v
          print(json.dumps({"Variables":vars}))
          PY
            echo "🔧 Env JSON written: /tmp/${function_name}_env.json"
          }

          write_vpc_json () {
            local function_name="$1"

            if [ -z "${VPC_SUBNET_IDS:-}" ] || [ -z "${VPC_SECURITY_GROUP_ID:-}" ]; then
              echo "❌ VPC_SUBNET_IDS / VPC_SECURITY_GROUP_ID not set"
              exit 1
            fi

            python3 - <<PY >"/tmp/${function_name}_vpc.json"
          import json, os, re, sys

          raw_subnets = os.environ["VPC_SUBNET_IDS"]
          sg_id = os.environ["VPC_SECURITY_GROUP_ID"].strip()

          subnet_ids = [s.strip() for s in raw_subnets.split(",") if s.strip()]

          if not subnet_ids:
              print("No subnet IDs provided", file=sys.stderr)
              sys.exit(1)

          for subnet in subnet_ids:
              if not re.match(r"^subnet-[0-9a-fA-F]+$", subnet):
                  print(f"Invalid subnet ID: {subnet}", file=sys.stderr)
                  sys.exit(1)

          if not re.match(r"^sg-[0-9a-fA-F]+$", sg_id):
              print(f"Invalid security group ID: {sg_id}", file=sys.stderr)
                  # note: keep existing behavior
              sys.exit(1)

          print(json.dumps({
              "SubnetIds": subnet_ids,
              "SecurityGroupIds": [sg_id]
          }))
          PY
          }

          write_efs_json () {
            local function_name="$1"

            if [ -z "${EFS_ACCESS_POINT_ARN:-}" ]; then
              echo "❌ EFS_ACCESS_POINT_ARN not set"
              exit 1
            fi

            python3 - <<PY >"/tmp/${function_name}_efs.json"
          import json,os
          arn = os.environ["EFS_ACCESS_POINT_ARN"]
          print(json.dumps([{"Arn": arn, "LocalMountPath": "/mnt/efs"}]))
          PY
          }

          deploy_lambda () {
            local function_name="$1"
            local handler="${function_name}.lambda_handler"

            # Use the runtime from env (set above). Defaults to python3.11 if not provided.
            local runtime="${LAMBDA_PY_RUNTIME:-python3.11}"

            local timeout="${2:-60}"
            local memory="${3:-256}"
            shift 3

            # Split args with marker: --env ... --files ...
            local mode=""
            local -a env_pairs=()
            local -a files=()

            for arg in "$@"; do
              if [ "$arg" = "--env" ]; then mode="env"; continue; fi
              if [ "$arg" = "--files" ]; then mode="files"; continue; fi
              if [ "$mode" = "env" ]; then env_pairs+=("$arg"); continue; fi
              if [ "$mode" = "files" ]; then files+=("$arg"); continue; fi
            done

            if [ "${#files[@]}" -eq 0 ]; then
              echo "❌ No files provided for ${function_name}"
              exit 1
            fi

            echo "──────────────────────────────────────────"
            echo "Deploying: ${function_name}"
            echo "  Handler : ${handler}"
            echo "  Runtime : ${runtime}"
            echo "  Files   : ${files[*]}"
            echo "──────────────────────────────────────────"

            build_zip "${function_name}" "${files[@]}"
            write_env_json "${function_name}" "${env_pairs[@]}"
            write_vpc_json "${function_name}"
            write_efs_json "${function_name}"

            if aws lambda get-function --function-name "${function_name}" >/dev/null 2>&1; then
              echo "🔄 Function exists — updating code..."
              aws lambda update-function-code \
                --function-name "${function_name}" \
                --zip-file "fileb://${function_name}.zip" >/dev/null

              aws lambda wait function-updated --function-name "${function_name}"

              echo "🔧 Updating configuration..."
              aws lambda update-function-configuration \
                --function-name "${function_name}" \
                --runtime "${runtime}" \
                --handler "${handler}" \
                --role "${LAMBDA_ROLE_ARN}" \
                --timeout "${timeout}" \
                --memory-size "${memory}" \
                --environment "file:///tmp/${function_name}_env.json" \
                --vpc-config "file:///tmp/${function_name}_vpc.json" \
                --file-system-configs "file:///tmp/${function_name}_efs.json" >/dev/null

              aws lambda wait function-updated --function-name "${function_name}"

            else
              echo "🆕 Function not found — creating..."
              aws lambda create-function \
                --function-name "${function_name}" \
                --runtime "${runtime}" \
                --role "${LAMBDA_ROLE_ARN}" \
                --handler "${handler}" \
                --zip-file "fileb://${function_name}.zip" \
                --timeout "${timeout}" \
                --memory-size "${memory}" \
                --environment "file:///tmp/${function_name}_env.json" \
                --vpc-config "file:///tmp/${function_name}_vpc.json" \
                --file-system-configs "file:///tmp/${function_name}_efs.json" >/dev/null

              aws lambda wait function-active --function-name "${function_name}"
            fi

            echo "✅ Done: ${function_name}"
          }

          # ── lambda_monthly_pnl ─────────────────────────────────────────────
          deploy_lambda "lambda_monthly_pnl" 60 256 \
            --env \
              "DB_PATH=/mnt/efs/mystocks.db" \
              "S3_BUCKET_NAME=${S3_BUCKET_NAME}" \
            --files \
              "lambda_monthly_pnl.py" \
              "crud_db.py" \
              "services"

          # ── lambda_s3_to_efs ───────────────────────────────────────────────
          deploy_lambda "lambda_s3_to_efs" 60 256 \
            --env \
              "S3_BUCKET_NAME=${S3_BUCKET_NAME}" \
              "EFS_PATH=/mnt/efs" \
            --files \
              "lambda_s3_to_efs.py"

          # ── lambda_portfolio_performance ──────────────────────────────────
          deploy_lambda "lambda_portfolio_performance" 60 256 \
            --env \
              "DB_PATH=/mnt/efs/mystocks.db" \
              "S3_BUCKET_NAME=${S3_BUCKET_NAME}" \
            --files \
              "lambda_portfolio_performance.py" \
              "crud_db.py" \
              "portfolio_performance.py" \
              "services"

          # ── consolidated monthly report ───────────────────────────────────
          deploy_lambda "lambda_consolidated_monthly_report" 60 256 \
            --env \
              "DB_PATH=/mnt/efs/mystocks.db" \
              "S3_BUCKET_NAME=${S3_BUCKET_NAME}" \
              "STOCK_RETRIEVAL_FUNCTION_NAME=stock_retrieval_lambda" \
              "AWS_REGION=${AWS_REGION}" \
            --files \
              "lambda_consolidated_monthly_report.py" \
              "crud_db.py" \
              "monthly_ledger.py" \
              "monthly_performance.py" \
              "portfolio_performance.py" \
              "services" \
              "s3_db_sync.py"