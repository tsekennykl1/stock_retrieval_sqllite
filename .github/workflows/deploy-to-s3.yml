name: Deploy SQLite DB to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SQLite Database
        run: python create_db.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload SQLite DB to S3
        run: |
          aws s3 cp mystocks.db s3://${{ secrets.S3_BUCKET_NAME }}/mystocks.db
          echo "Database uploaded successfully!"

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }}/github \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.yml" \
            --exclude "*.md"

      - name: Deploy Python files to AWS Lambda
        run: |
          allowed_files=("lambda_monthly_pnl.py")

          for file in "${allowed_files[@]}"; do
            if [ -f "$file" ]; then
              function_name=$(basename "$file" .py)
              zip -j "$function_name.zip" "$file"
              aws lambda update-function-code \
                --function-name "$function_name" \
                --zip-file "fileb://$function_name.zip"
              echo "Deployed $file to Lambda function $function_name"
            else
              echo "File $file not found, skipping"
            fi
          done