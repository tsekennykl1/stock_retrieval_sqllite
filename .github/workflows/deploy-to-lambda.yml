name: Deploy Lambdas (S3 DB Sync)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_db:
        description: "Sync mystocks.db to S3?"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "from_github"

concurrency:
  group: deploy-lambdas-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (build env matches Lambda runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling (zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      # ── Only generate DB when explicitly requested ─────────────────────────
      - name: Generate SQLite Database (from GitHub source)
        if: github.event.inputs.sync_db == 'from_github'
        run: python create_db.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ── Upload fresh DB to S3 only when generated from GitHub ──────────────
      - name: Upload mystocks.db to S3
        if: github.event.inputs.sync_db == 'from_github'
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 cp mystocks.db "s3://${S3_BUCKET_NAME}/mystocks.db"
          echo "✅ Database uploaded to S3 staging area"

      - name: Sync GitHub files to S3 (excludes DB)
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          aws s3 sync . "s3://${S3_BUCKET_NAME}/github" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.yml" \
            --exclude "*.md" \
            --exclude ".venv/*" \
            --exclude "__pycache__/*" \
            --exclude "mystocks.db"
          echo "✅ Files synced to S3"

      # ── Deploy Lambdas ─────────────────────────────────────────────────────
      - name: Deploy Lambda functions
        env:
          S3_BUCKET_NAME:         ${{ secrets.S3_BUCKET_NAME }}
          LAMBDA_ROLE_ARN:        ${{ secrets.LAMBDA_ROLE_ARN }}
          LAMBDA_PY_RUNTIME:      python3.13
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          build_zip () {
            local function_name="$1"
            shift
            rm -rf build/*
            rm -f "${function_name}.zip"

            for path in "$@"; do
              if [ -d "$path" ]; then
                cp -R "$path" build/
              else
                cp "$path" build/
              fi
            done

            if [ -f "requirements_${function_name}.txt" ]; then
              pip install -r "requirements_${function_name}.txt" -t build/
            elif [ -f "requirements.txt" ]; then
              pip install -r requirements.txt -t build/
            fi

            (cd build && zip -r "../${function_name}.zip" .)
            echo "✅ Zip created: ${function_name}.zip"
          }

          write_env_json () {
            local function_name="$1"
            shift

            python3 - "$@" <<'PY' >"/tmp/${function_name}_env.json"
          import json,sys
          vars={}
          for pair in sys.argv[1:]:
            k,v = pair.split("=",1)
            vars[k]=v
          print(json.dumps({"Variables":vars}))
          PY
            echo "🔧 Env JSON written: /tmp/${function_name}_env.json"
          }

          deploy_lambda () {
            local function_name="$1"
            local handler="${function_name}.lambda_handler"
            local runtime="${LAMBDA_PY_RUNTIME:-python3.13}"
            local timeout="${2:-60}"
            local memory="${3:-256}"
            shift 3

            local mode=""
            local -a env_pairs=()
            local -a files=()

            for arg in "$@"; do
              if [ "$arg" = "--env" ]; then mode="env"; continue; fi
              if [ "$arg" = "--files" ]; then mode="files"; continue; fi
              if [ "$mode" = "env" ]; then env_pairs+=("$arg"); continue; fi
              if [ "$mode" = "files" ]; then files+=("$arg"); continue; fi
            done

            if [ "${#files[@]}" -eq 0 ]; then
              echo "❌ No files provided for ${function_name}"
              exit 1
            fi

            echo "──────────────────────────────────────────"
            echo "Deploying: ${function_name}"
            echo "  Handler : ${handler}"
            echo "  Runtime : ${runtime}"
            echo "  Files   : ${files[*]}"
            echo "──────────────────────────────────────────"

            build_zip "${function_name}" "${files[@]}"
            write_env_json "${function_name}" "${env_pairs[@]}"

            if aws lambda get-function --function-name "${function_name}" >/dev/null 2>&1; then
              echo "🔄 Function exists — updating code..."
              aws lambda update-function-code \
                --function-name "${function_name}" \
                --zip-file "fileb://${function_name}.zip" >/dev/null

              aws lambda wait function-updated --function-name "${function_name}"

              echo "🔧 Updating configuration (clearing VPC/EFS)..."
              aws lambda update-function-configuration \
                --function-name "${function_name}" \
                --runtime "${runtime}" \
                --handler "${handler}" \
                --role "${LAMBDA_ROLE_ARN}" \
                --timeout "${timeout}" \
                --memory-size "${memory}" \
                --environment "file:///tmp/${function_name}_env.json" \
                --vpc-config "SubnetIds=[],SecurityGroupIds=[]" \
                --file-system-configs "[]" >/dev/null

              aws lambda wait function-updated --function-name "${function_name}"

            else
              echo "🆕 Function not found — creating..."
              aws lambda create-function \
                --function-name "${function_name}" \
                --runtime "${runtime}" \
                --role "${LAMBDA_ROLE_ARN}" \
                --handler "${handler}" \
                --zip-file "fileb://${function_name}.zip" \
                --timeout "${timeout}" \
                --memory-size "${memory}" \
                --environment "file:///tmp/${function_name}_env.json" >/dev/null

              aws lambda wait function-active --function-name "${function_name}"
            fi

            echo "✅ Done: ${function_name}"
          }

          # ── lambda_crud_handler (S3 ↔ /tmp sync) ──────────────────────────
          deploy_lambda "lambda_crud_handler" 60 256 \
            --env \
              "S3_BUCKET_NAME=${S3_BUCKET_NAME}" \
              "S3_DB_KEY=mystocks.db" \
              "FORCE_DB_OVERWRITE=true" \
            --files \
              "lambda_crud_handler.py" \
              "crud_db.py" \
              "services"

          # ── lambda_consolidated_monthly_report ─────────────────────────────
          deploy_lambda "lambda_consolidated_monthly_report" 60 256 \
            --env \
              "S3_BUCKET_NAME=${S3_BUCKET_NAME}" \
              "S3_DB_KEY=mystocks.db" \
              "FORCE_DB_OVERWRITE=true" \
              "STOCK_RETRIEVAL_FUNCTION_NAME=yfinance-lambda" \
              "ALLOWED_ORIGIN=https://staging.d37gylpwhasobk.amplifyapp.com" \
            --files \
              "lambda_consolidated_monthly_report.py" \
              "crud_db.py" \
              "services"